// ─── ANALYSES ────────────────────────────────────────────────────────────────
function Analyses({ transactions, settings, months }) {
  const { income, categories } = settings;
  const today = new Date();
  const currentYM = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}`;
  const daysInMonth = new Date(today.getFullYear(), today.getMonth()+1, 0).getDate();
  const dayOfMonth = today.getDate();
  const pctElapsed = dayOfMonth / daysInMonth;

  // Laatste 12 maanden (exclusief huidige)
  const last12 = months.filter(m => m !== currentYM).slice(0, 12);

  return (
    <div style={{padding:14}}>
      <PrognoseBlock
        transactions={transactions} categories={categories} income={income}
        currentYM={currentYM} pctElapsed={pctElapsed} dayOfMonth={dayOfMonth} daysInMonth={daysInMonth}
        referenceMonths={last12}
      />
      <ConsistencyBlock
        transactions={transactions} categories={categories} income={income}
        months={last12}
      />
      <RecurringBlock
        transactions={transactions} categories={categories}
        months={months}
      />
    </div>
  );
}

// ─── BLOK 1: EINDE-MAAND PROGNOSE ───────────────────────────────────────────
function PrognoseBlock({ transactions, categories, income, currentYM, pctElapsed, dayOfMonth, daysInMonth, referenceMonths }){
  // Spent tot nu toe in huidige maand
  const spentSoFar = transactions
    .filter(t => t.afBij==="Af" && !SKIP_CATS.has(t.categorie) && t.datum.slice(0,7)===currentYM)
    .reduce((s,t)=>s+t.bedrag,0);

  // Prognose: lineaire extrapolatie op basis van dagen verstreken
  const projected = pctElapsed > 0.01 ? spentSoFar / pctElapsed : spentSoFar;

  const delta = projected - income;
  const onTrack = projected <= income;

  // Per categorie: hoeveel uitgegeven, prognose, budget
  const catRows = categories.map(cat => {
    const spent = getCatTotal(transactions, cat.name, currentYM);
    const projCat = pctElapsed > 0.01 ? spent / pctElapsed : spent;
    const budget = income * cat.pct;
    const ruimte = budget - spent;
    const overshoot = !cat.skipRed && projCat > budget;
    return { ...cat, spent, projCat, budget, ruimte, overshoot };
  });

  const overshooters = catRows.filter(c => c.overshoot).sort((a,b) => (b.projCat-b.budget)-(a.projCat-a.budget));
  const ruimOver = catRows.filter(c => !c.overshoot && c.budget>0 && c.ruimte > 10).sort((a,b) => b.ruimte - a.ruimte);

  return (
    <div style={{background:"white",borderRadius:16,padding:16,marginBottom:14,boxShadow:"0 1px 6px rgba(0,0,0,0.06)"}}>
      <div style={{fontSize:11,fontWeight:700,color:"#8A9BB0",letterSpacing:0.8,marginBottom:10}}>EINDE-MAAND PROGNOSE</div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:6}}>
        <div>
          <div style={{fontSize:11,color:"#9AA5B4"}}>Prognose {monthLabel(currentYM)} (dag {dayOfMonth}/{daysInMonth})</div>
          <div style={{fontSize:26,fontWeight:800,color:onTrack?"#27AE60":"#E74C3C",lineHeight:1.1,marginTop:3}}>€{fmt(projected)}</div>
          <div style={{fontSize:12,color:"#9AA5B4",marginTop:2}}>
            Tot nu: €{fmt(spentSoFar)} · Budget €{fmt(income)}
          </div>
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{fontSize:14,fontWeight:700,color:onTrack?"#27AE60":"#E74C3C"}}>
            {onTrack?"−":"+"}€{fmt(Math.abs(delta))}
          </div>
          <div style={{fontSize:10,color:"#9AA5B4"}}>{onTrack?"onder":"boven"} budget</div>
        </div>
      </div>
      {/* Voortgangsbalk: werkelijk vs budget, met dag-indicator */}
      <div style={{position:"relative",background:"#F0F4F8",borderRadius:6,height:10,overflow:"hidden",marginTop:10}}>
        <div style={{position:"absolute",top:0,left:0,height:"100%",width:`${Math.min(spentSoFar/income*100,100)}%`,background:onTrack?"#1F4E79":"#E74C3C",borderRadius:6}} />
        <div style={{position:"absolute",top:0,left:`${pctElapsed*100}%`,height:"100%",width:2,background:"rgba(0,0,0,0.35)"}} title="Dag verstreken" />
      </div>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:4,fontSize:10,color:"#9AA5B4"}}>
        <span>{Math.round(spentSoFar/income*100)}% uitgegeven</span>
        <span>{Math.round(pctElapsed*100)}% maand voorbij</span>
      </div>

      {overshooters.length > 0 && (
        <div style={{marginTop:14}}>
          <div style={{fontSize:10,fontWeight:700,color:"#C0392B",letterSpacing:0.5,marginBottom:6}}>KOERS OP OVERSCHRIJDING</div>
          {overshooters.slice(0,5).map((c,i) => (
            <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 0",fontSize:12}}>
              <span style={{fontSize:14}}>{c.icon}</span>
              <div style={{flex:1,color:"#2C3E50"}}>{c.name}</div>
              <div style={{color:"#C0392B",fontWeight:700}}>€{fmt(c.projCat)}</div>
              <div style={{color:"#9AA5B4",fontSize:10,minWidth:52,textAlign:"right"}}>budget €{fmt(c.budget)}</div>
            </div>
          ))}
        </div>
      )}
      {ruimOver.length > 0 && overshooters.length === 0 && (
        <div style={{marginTop:14}}>
          <div style={{fontSize:10,fontWeight:700,color:"#27AE60",letterSpacing:0.5,marginBottom:6}}>MEESTE RUIMTE OVER</div>
          {ruimOver.slice(0,3).map((c,i) => (
            <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 0",fontSize:12}}>
              <span style={{fontSize:14}}>{c.icon}</span>
              <div style={{flex:1,color:"#2C3E50"}}>{c.name}</div>
              <div style={{color:"#27AE60",fontWeight:700}}>€{fmt(c.ruimte)}</div>
              <div style={{color:"#9AA5B4",fontSize:10,minWidth:52,textAlign:"right"}}>over</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── BLOK 2: BUDGET-CONSISTENTIE (12 mnd grid) ──────────────────────────────
function ConsistencyBlock({ transactions, categories, income, months }){
  // Voor elke cat: per maand was je binnen budget?
  const rows = categories.map(cat => {
    const budget = income * cat.pct;
    const monthStates = months.map(m => {
      const v = getCatTotal(transactions, cat.name, m);
      if (v === 0 && budget > 0) return "nodata";
      const ok = cat.skipRed ? true : v <= budget;
      return ok ? "ok" : "over";
    });
    const binnenAantal = monthStates.filter(s => s === "ok").length;
    const totaalAantal = monthStates.filter(s => s !== "nodata").length;
    return { ...cat, budget, monthStates, binnenAantal, totaalAantal };
  }).filter(c => c.totaalAantal > 0);

  // Sorteer: slechtste eerst (laagste ratio)
  rows.sort((a,b) => (a.binnenAantal/a.totaalAantal) - (b.binnenAantal/b.totaalAantal));

  return (
    <div style={{background:"white",borderRadius:16,padding:16,marginBottom:14,boxShadow:"0 1px 6px rgba(0,0,0,0.06)"}}>
      <div style={{fontSize:11,fontWeight:700,color:"#8A9BB0",letterSpacing:0.8,marginBottom:4}}>BUDGET-CONSISTENTIE</div>
      <div style={{fontSize:11,color:"#B0BEC5",marginBottom:12}}>Laatste {months.length} maanden · elk blokje = 1 maand (oud → recent)</div>
      {rows.length === 0 && <div style={{color:"#9AA5B4",fontSize:13}}>Niet genoeg data</div>}
      {rows.map((c,i) => (
        <div key={i} style={{marginBottom:10}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}>
            <span style={{fontSize:14}}>{c.icon}</span>
            <div style={{flex:1,fontSize:12,fontWeight:600,color:"#2C3E50"}}>{c.name}</div>
            <div style={{fontSize:11,fontWeight:700,color:c.binnenAantal===c.totaalAantal?"#27AE60":c.binnenAantal===0?"#C0392B":"#2C3E50"}}>
              {c.binnenAantal}/{c.totaalAantal}
            </div>
          </div>
          <div style={{display:"flex",gap:2}}>
            {[...c.monthStates].reverse().map((s,j) => (
              <div key={j} title={monthLabel(months[c.monthStates.length-1-j])}
                style={{flex:1,height:16,borderRadius:2,
                  background: s==="ok"?"#27AE60": s==="over"?"#E74C3C":"#E8ECF0"}} />
            ))}
          </div>
        </div>
      ))}
      <div style={{marginTop:10,display:"flex",gap:12,fontSize:10,color:"#9AA5B4"}}>
        <span><span style={{display:"inline-block",width:10,height:10,background:"#27AE60",borderRadius:2,marginRight:4,verticalAlign:"middle"}} />binnen budget</span>
        <span><span style={{display:"inline-block",width:10,height:10,background:"#E74C3C",borderRadius:2,marginRight:4,verticalAlign:"middle"}} />over budget</span>
        <span><span style={{display:"inline-block",width:10,height:10,background:"#E8ECF0",borderRadius:2,marginRight:4,verticalAlign:"middle"}} />geen data</span>
      </div>
    </div>
  );
}

// ─── BLOK 3: TERUGKERENDE VASTE LASTEN ──────────────────────────────────────
function RecurringBlock({ transactions, categories, months }){
  // Gebruik laatste 6 maanden voor detectie
  const windowMonths = months.slice(0, 6);
  if (windowMonths.length < 3) {
    return (
      <div style={{background:"white",borderRadius:16,padding:16,boxShadow:"0 1px 6px rgba(0,0,0,0.06)"}}>
        <div style={{fontSize:11,fontWeight:700,color:"#8A9BB0",letterSpacing:0.8,marginBottom:10}}>TERUGKERENDE VASTE LASTEN</div>
        <div style={{color:"#9AA5B4",fontSize:13}}>Minimaal 3 maanden data nodig.</div>
      </div>
    );
  }

  // Normalize name: lowercase, strip digits/locaties
  function normName(n){
    return String(n).toLowerCase()
      .replace(/\d+/g,"")
      .replace(/\b(nld|groningen|amsterdam|utrecht|rotterdam|den haag|via|tikkie|betaalverzoek|rabo)\b/g,"")
      .replace(/[^\w\s]/g," ")
      .replace(/\s+/g," ").trim();
  }

  // Groepeer Af-transacties op genormaliseerde naam
  const buckets = new Map();
  transactions.forEach(t => {
    if (t.afBij !== "Af" || SKIP_CATS.has(t.categorie)) return;
    const ym = t.datum.slice(0,7);
    if (!windowMonths.includes(ym)) return;
    const key = normName(t.naam);
    if (!key || key.length < 3) return;
    if (!buckets.has(key)) buckets.set(key, []);
    buckets.get(key).push({ ...t, _ym: ym });
  });

  // Filter: in ≥3 verschillende maanden gezien, en bedrag consistent
  const recurring = [];
  buckets.forEach((txs, key) => {
    const uniqueMonths = new Set(txs.map(t => t._ym));
    if (uniqueMonths.size < 3) return;
    const amounts = txs.map(t => t.bedrag);
    const avg = amounts.reduce((s,a)=>s+a,0) / amounts.length;
    if (avg < 3) return; // te klein om als 'vaste last' te kwalificeren
    // Consistent bedrag: std/gem < 0.3, of bedragen allemaal dezelfde honderd
    const variance = amounts.reduce((s,a)=>s+(a-avg)**2,0) / amounts.length;
    const std = Math.sqrt(variance);
    const cv = avg > 0 ? std/avg : 1;
    if (cv > 0.4) return;
    // Meest gebruikte naam + categorie
    const nameCount = {};
    const catCount = {};
    txs.forEach(t => {
      nameCount[t.naam] = (nameCount[t.naam]||0)+1;
      catCount[t.categorie] = (catCount[t.categorie]||0)+1;
    });
    const displayName = Object.entries(nameCount).sort((a,b)=>b[1]-a[1])[0][0];
    const displayCat = Object.entries(catCount).sort((a,b)=>b[1]-a[1])[0][0];
    recurring.push({
      key, displayName, displayCat,
      monthsSeen: uniqueMonths.size,
      count: txs.length,
      avgAmount: avg
    });
  });
  recurring.sort((a,b) => b.avgAmount - a.avgAmount);

  const totaalPerMaand = recurring.reduce((s,r) => s + r.avgAmount * (r.monthsSeen/windowMonths.length), 0);

  const catDef = (name) => categories.find(c => c.name === name);

  return (
    <div style={{background:"white",borderRadius:16,padding:16,marginBottom:14,boxShadow:"0 1px 6px rgba(0,0,0,0.06)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:4}}>
        <div style={{fontSize:11,fontWeight:700,color:"#8A9BB0",letterSpacing:0.8}}>TERUGKERENDE VASTE LASTEN</div>
        <div style={{fontSize:11,color:"#9AA5B4"}}>~ €{fmt(totaalPerMaand)}/mnd</div>
      </div>
      <div style={{fontSize:11,color:"#B0BEC5",marginBottom:12}}>Laatste {windowMonths.length} maanden · ≥3× gezien met stabiel bedrag</div>
      {recurring.length === 0 && <div style={{color:"#9AA5B4",fontSize:13}}>Geen duidelijke vaste lasten gedetecteerd.</div>}
      {recurring.slice(0,15).map((r,i) => {
        const c = catDef(r.displayCat);
        return (
          <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:i<Math.min(recurring.length,15)-1?"1px solid #F5F7FA":"none"}}>
            <div style={{minWidth:32,width:32,height:32,borderRadius:8,background:c?.color??"#E8ECF0",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15}}>
              {c?.icon??"🔁"}
            </div>
            <div style={{flex:1,overflow:"hidden"}}>
              <div style={{fontSize:12,fontWeight:600,color:"#2C3E50",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{r.displayName}</div>
              <div style={{fontSize:10,color:"#9AA5B4"}}>{r.displayCat} · {r.monthsSeen}/{windowMonths.length} mnd</div>
            </div>
            <div style={{fontSize:13,fontWeight:700,color:"#2C3E50"}}>€{fmt(r.avgAmount)}</div>
          </div>
        );
      })}
    </div>
  );
}

// ─── INSTELLINGEN ────────────────────────────────────────────────────────────
const PRESET_COLORS = ["#AED6F1","#A9DFBF","#F9E79F","#F1948A","#D7BDE2","#85C1E9","#FAD7A0","#F8C471","#D5DBDB","#AEB6BF","#A3E4D7","#C5CAE9","#F5B7B1","#BB8FCE","#76D7C4","#F7DC6F"];

function Instellingen({ settings, setSettings, transactions, setTransactions, showToast, dashSort, setDashSort, session }) {
  const [income, setIncome] = useState(settings.income);
  const [cats, setCats] = useState(settings.categories);
  const [showAdd, setShowAdd] = useState(false);
  const [pendingDelete, setPendingDelete] = useState(null);
  const [dragIdx, setDragIdx] = useState(null);
  const [dragOverIdx, setDragOverIdx] = useState(null);
  const [orderChanged, setOrderChanged] = useState(false);
  const [showSavePopup, setShowSavePopup] = useState(false);

  async function handleLogout(){
    if (sb) await sb.auth.signOut();
  }

  // Sync cats wanneer settings van buiten wijzigt (ook reset van orderChanged)
  useEffect(()=>{ setCats(settings.categories); setOrderChanged(false); }, [settings.categories]);
  useEffect(()=>{ setIncome(settings.income); }, [settings.income]);

  // Dirty-state detectie
  const incomeDirty = (parseFloat(income)||0) !== (parseFloat(settings.income)||0);
  const pctDirty = cats.length === settings.categories.length &&
    cats.some((c, i) => Math.abs(c.pct - (settings.categories[i]?.pct ?? 0)) > 1e-6);
  const dirty = incomeDirty || pctDirty || orderChanged;

  function reorderCats(from, to) {
    if (from === to || from < 0 || to < 0 || from >= cats.length || to >= cats.length) return;
    const next = cats.slice();
    const [moved] = next.splice(from, 1);
    next.splice(to, 0, moved);
    setCats(next);
    setOrderChanged(true);
  }

  function handleSaveClick() {
    if (orderChanged) {
      setShowSavePopup(true);
    } else {
      doSave();
    }
  }
  function doSave(applyToDashboard) {
    setSettings({ income: parseFloat(income)||0, categories: cats });
    if (applyToDashboard === true) setDashSort("fixed");
    setOrderChanged(false);
    setShowSavePopup(false);
    if (showToast) showToast("Instellingen opgeslagen");
  }
  function discard() {
    setIncome(settings.income);
    setCats(settings.categories);
    setOrderChanged(false);
  }

  function updateCatPct(i, val) {
    const newCats = cats.map((c,j) => j===i ? {...c, pct: parseFloat(val)/100 || c.pct} : c);
    setCats(newCats);
  }

  function addCategory(newCat) {
    const updated = [...cats, newCat];
    setCats(updated);
    setSettings({ income: parseFloat(income)||0, categories: updated });
    setShowAdd(false);
    if (showToast) showToast(`Categorie "${newCat.name}" toegevoegd`);
  }

  function requestDelete(index) {
    const cat = cats[index];
    const txCount = transactions.filter(t => t.categorie === cat.name).length;
    setPendingDelete({ index, cat, txCount, action: txCount>0?"move":"simple", target: "Onbekend" });
  }

  function confirmDelete() {
    if (!pendingDelete) return;
    const { cat, action, target } = pendingDelete;
    const remainingCats = cats.filter(c => c.name !== cat.name);

    if (action === "delete") {
      // Verwijder ook transacties met deze categorie
      setTransactions(prev => prev.filter(t => t.categorie !== cat.name));
    } else if (action === "move" && pendingDelete.txCount > 0) {
      // Verplaats transacties naar target categorie
      setTransactions(prev => prev.map(t => t.categorie === cat.name ? {...t, categorie: target} : t));
    }
    setCats(remainingCats);
    setSettings({ income: parseFloat(income)||0, categories: remainingCats });
    setPendingDelete(null);
    if (showToast) showToast(`Categorie "${cat.name}" verwijderd`);
  }

  const totalPct = cats.reduce((s,c)=>s+c.pct,0);
  const catTargets = [...cats.filter(c=>pendingDelete && c.name!==pendingDelete.cat.name).map(c=>c.name), "Onbekend"];

  return (
    <div style={{padding:14,position:"relative"}}>
      {dirty && (
        <div style={{position:"sticky",top:0,zIndex:50,background:"rgba(244,246,249,0.95)",backdropFilter:"blur(6px)",
          display:"flex",justifyContent:"flex-end",alignItems:"center",gap:8,padding:"6px 0 10px",marginBottom:4}}>
          <button onClick={discard}
            style={{padding:"8px 14px",borderRadius:10,border:"1px solid #E0E6ED",background:"white",color:"#5A6A7A",fontSize:12,fontWeight:600,cursor:"pointer"}}>
            Annuleren
          </button>
          <button onClick={handleSaveClick}
            style={{padding:"8px 16px",borderRadius:10,border:"none",background:"#1F4E79",color:"white",fontSize:12,fontWeight:700,cursor:"pointer",boxShadow:"0 2px 8px rgba(31,78,121,0.25)"}}>
            Opslaan
          </button>
        </div>
      )}
      {/* Account */}
      {session && (
        <div style={{background:"white",borderRadius:16,padding:16,marginBottom:12,boxShadow:"0 1px 6px rgba(0,0,0,0.06)",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
          <div style={{overflow:"hidden"}}>
            <div style={{fontSize:11,fontWeight:700,color:"#8A9BB0",letterSpacing:0.8,marginBottom:2}}>ACCOUNT</div>
            <div style={{fontSize:13,color:"#2C3E50",fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{session.user.email}</div>
          </div>
          <button onClick={handleLogout}
            style={{padding:"8px 14px",borderRadius:10,border:"1px solid #E0E6ED",background:"white",color:"#C0392B",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>
            Uitloggen
          </button>
        </div>
      )}
      {/* Income */}
      <div style={{background:"white",borderRadius:16,padding:16,marginBottom:12,boxShadow:"0 1px 6px rgba(0,0,0,0.06)"}}>
        <div style={{fontSize:11,fontWeight:700,color:"#8A9BB0",marginBottom:12,letterSpacing:0.8}}>MAANDINKOMEN</div>
        <div style={{display:"flex",alignItems:"center",gap:8,borderBottom:"2px solid #E8ECF0",paddingBottom:8}}>
          <span style={{fontSize:20,fontWeight:700,color:"#9AA5B4"}}>€</span>
          <input type="number" value={income} onChange={e=>setIncome(e.target.value)}
            style={{fontSize:22,fontWeight:700,color:"#1F4E79",border:"none",width:"100%",background:"transparent"}} />
        </div>
        <div style={{fontSize:11,color:"#9AA5B4",marginTop:8}}>Alle percentages berekenen op dit bedrag</div>
      </div>

      {/* Categories */}
      <div style={{background:"white",borderRadius:16,padding:16,marginBottom:12,boxShadow:"0 1px 6px rgba(0,0,0,0.06)"}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:12,alignItems:"center"}}>
          <div style={{fontSize:11,fontWeight:700,color:"#8A9BB0",letterSpacing:0.8}}>BUDGETTEN</div>
          <div style={{fontSize:11,color:Math.abs(totalPct-1)>0.005?"#E74C3C":"#27AE60",fontWeight:600}}>Totaal: {Math.round(totalPct*100)}%</div>
        </div>
        {cats.map((cat,i) => {
          const isDragging = dragIdx === i;
          const isTarget = dragOverIdx === i && dragIdx !== null && dragIdx !== i;
          return (
            <div key={cat.name}
              onDragOver={e => { if (dragIdx !== null) { e.preventDefault(); setDragOverIdx(i); } }}
              onDragLeave={() => { if (dragOverIdx === i) setDragOverIdx(null); }}
              onDrop={e => { e.preventDefault(); if (dragIdx !== null) reorderCats(dragIdx, i); setDragIdx(null); setDragOverIdx(null); }}
              style={{
                display:"flex",alignItems:"center",padding:"9px 0",
                borderBottom:i<cats.length-1?"1px solid #F5F7FA":"none",
                gap:10,
                opacity: isDragging ? 0.4 : 1,
                background: isTarget ? "#F0F4F8" : "transparent",
                borderTop: isTarget && dragIdx > i ? "2px solid #1F4E79" : undefined,
                borderBottom: isTarget && dragIdx < i ? "2px solid #1F4E79" : (i<cats.length-1?"1px solid #F5F7FA":"none"),
                transition:"background 0.1s"
              }}>
              <span style={{fontSize:18,minWidth:24}}>{cat.icon}</span>
              <div style={{flex:1,fontSize:13,color:"#2C3E50",fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{cat.name}</div>
              <div style={{display:"flex",alignItems:"center",gap:4}}>
                <input type="number" value={Math.round(cat.pct*1000)/10} onChange={e=>updateCatPct(i,e.target.value)}
                  step="0.1" min="0" max="100"
                  style={{width:52,textAlign:"right",fontSize:13,fontWeight:700,color:"#1F4E79",border:"1px solid #E0E6ED",borderRadius:6,padding:"3px 5px"}} />
                <span style={{fontSize:12,color:"#9AA5B4"}}>%</span>
              </div>
              <div style={{width:50,fontSize:12,color:"#9AA5B4",textAlign:"right"}}>€{fmt((parseFloat(income)||0)*cat.pct)}</div>
              <button onClick={()=>requestDelete(i)} title="Categorie verwijderen"
                style={{border:"none",background:"transparent",cursor:"pointer",fontSize:15,color:"#C0392B",padding:"2px 4px"}}>🗑</button>
              <div
                draggable
                onDragStart={e => { setDragIdx(i); e.dataTransfer.effectAllowed = "move"; }}
                onDragEnd={() => { setDragIdx(null); setDragOverIdx(null); }}
                title="Sleep om volgorde te wijzigen"
                style={{cursor:"grab",color:"#B0BEC5",fontSize:16,padding:"2px 4px",userSelect:"none",lineHeight:1}}>
                ☰
              </div>
            </div>
          );
        })}
        <button onClick={()=>setShowAdd(true)}
          style={{marginTop:12,width:"100%",padding:10,borderRadius:10,border:"1px dashed #B0BEC5",background:"#F8FAFB",color:"#1F4E79",fontSize:13,fontWeight:700,cursor:"pointer"}}>
          + Categorie toevoegen
        </button>
      </div>

      {showAdd && <AddCategoryModal existing={cats} onCancel={()=>setShowAdd(false)} onAdd={addCategory} />}

      {showSavePopup && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div style={{background:"white",borderRadius:16,maxWidth:360,width:"100%",padding:"18px 20px",boxShadow:"0 10px 30px rgba(0,0,0,0.3)"}}>
            <div style={{fontSize:16,fontWeight:800,color:"#1F4E79",marginBottom:10}}>Dashboard-weergave aanpassen?</div>
            <div style={{fontSize:13,color:"#2C3E50",lineHeight:1.5,marginBottom:14}}>
              Je hebt de volgorde van categorieën gewijzigd. Wil je dat het Dashboard deze nieuwe volgorde ook toont?
              {dashSort !== "fixed" && (
                <div style={{marginTop:8,padding:"8px 10px",background:"#FEF3CD",borderRadius:8,fontSize:12,color:"#856404"}}>
                  Dashboard staat nu op <b>{DASH_SORT_OPTIONS.find(o=>o.id===dashSort)?.label}</b>. Je nieuwe volgorde is pas zichtbaar bij 'Vast'.
                </div>
              )}
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              <button onClick={()=>doSave(true)}
                style={{padding:12,borderRadius:10,border:"none",background:"#1F4E79",color:"white",fontSize:13,fontWeight:700,cursor:"pointer"}}>
                Ja, Dashboard op 'Vast' + opslaan
              </button>
              <button onClick={()=>doSave(false)}
                style={{padding:12,borderRadius:10,border:"1px solid #E0E6ED",background:"white",color:"#2C3E50",fontSize:13,fontWeight:600,cursor:"pointer"}}>
                Nee, alleen opslaan
              </button>
              <button onClick={()=>setShowSavePopup(false)}
                style={{padding:10,borderRadius:10,border:"none",background:"transparent",color:"#9AA5B4",fontSize:12,fontWeight:600,cursor:"pointer"}}>
                Annuleren
              </button>
            </div>
          </div>
        </div>
      )}

      {pendingDelete && (
        <ConfirmDialog
          title={`Categorie "${pendingDelete.cat.name}" verwijderen?`}
          confirmColor="#C0392B"
          confirmLabel={
            pendingDelete.txCount === 0 ? "Verwijderen" :
            pendingDelete.action === "delete" ? `Verwijder cat + ${pendingDelete.txCount} tx` :
            `Verplaats naar ${pendingDelete.target}`
          }
          onCancel={()=>setPendingDelete(null)}
          onConfirm={confirmDelete}
          body={
            <div style={{fontSize:13,color:"#2C3E50",lineHeight:1.5}}>
              {pendingDelete.txCount === 0
                ? <>Geen transacties gekoppeld. Weet je het zeker?</>
                : <><b>{pendingDelete.txCount}</b> transacties zijn aan deze categorie gekoppeld. Wat wil je hiermee doen?</>}
            </div>
          }
          extra={pendingDelete.txCount > 0 ? (
            <div style={{background:"#F8FAFB",borderRadius:10,padding:10,marginBottom:12}}>
              <div style={{display:"flex",gap:8,marginBottom:8}}>
                <label style={{flex:1,display:"flex",alignItems:"center",gap:6,fontSize:12,fontWeight:600,color:"#2C3E50",cursor:"pointer"}}>
                  <input type="radio" checked={pendingDelete.action==="move"} onChange={()=>setPendingDelete({...pendingDelete,action:"move"})} />
                  Verplaatsen
                </label>
                <label style={{flex:1,display:"flex",alignItems:"center",gap:6,fontSize:12,fontWeight:600,color:"#C0392B",cursor:"pointer"}}>
                  <input type="radio" checked={pendingDelete.action==="delete"} onChange={()=>setPendingDelete({...pendingDelete,action:"delete"})} />
                  Transacties verwijderen
                </label>
              </div>
              {pendingDelete.action==="move" && (
                <select value={pendingDelete.target} onChange={e=>setPendingDelete({...pendingDelete,target:e.target.value})}
                  style={{width:"100%",padding:"7px 8px",borderRadius:8,border:"1px solid #E0E6ED",fontSize:13,color:"#2C3E50",background:"white"}}>
                  {catTargets.map(c=><option key={c} value={c}>{c}</option>)}
                </select>
              )}
            </div>
          ) : null}
        />
      )}
    </div>
  );
}

// ─── ADD CATEGORY MODAL ──────────────────────────────────────────────────────
function AddCategoryModal({ existing, onCancel, onAdd }) {
  const [name, setName] = useState("");
  const [icon, setIcon] = useState("📦");
  const [color, setColor] = useState(PRESET_COLORS[0]);
  const [pctStr, setPctStr] = useState("5");
  const [skipRed, setSkipRed] = useState(false);
  const [err, setErr] = useState("");

  function submit() {
    const trimmed = name.trim();
    if (!trimmed) return setErr("Naam is verplicht");
    if (existing.some(c=>c.name.toLowerCase()===trimmed.toLowerCase())) return setErr("Naam bestaat al");
    if (["Inkomen","Interne transfer","Onbekend"].includes(trimmed)) return setErr("Naam is gereserveerd");
    const pct = (parseFloat(pctStr)||0)/100;
    if (pct < 0) return setErr("Percentage mag niet negatief zijn");
    onAdd({ name: trimmed, icon: icon || "📦", color, pct, skipRed });
  }

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"white",borderRadius:16,maxWidth:380,width:"100%",padding:"18px 20px",boxShadow:"0 10px 30px rgba(0,0,0,0.3)",maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{fontSize:16,fontWeight:800,color:"#1F4E79",marginBottom:14}}>Nieuwe categorie</div>

        <div style={{marginBottom:12}}>
          <div style={{fontSize:11,fontWeight:700,color:"#8A9BB0",marginBottom:4,letterSpacing:0.6}}>NAAM</div>
          <input value={name} onChange={e=>{setName(e.target.value);setErr("");}} placeholder="Bijv. Cadeaus"
            style={{width:"100%",padding:"9px 11px",borderRadius:8,border:"1px solid #E0E6ED",fontSize:13}} />
        </div>

        <div style={{display:"flex",gap:10,marginBottom:12}}>
          <div style={{flex:1}}>
            <div style={{fontSize:11,fontWeight:700,color:"#8A9BB0",marginBottom:4,letterSpacing:0.6}}>ICOON (EMOJI)</div>
            <input value={icon} onChange={e=>setIcon(e.target.value)} maxLength={2}
              style={{width:"100%",padding:"9px 11px",borderRadius:8,border:"1px solid #E0E6ED",fontSize:18,textAlign:"center"}} />
          </div>
          <div style={{flex:1}}>
            <div style={{fontSize:11,fontWeight:700,color:"#8A9BB0",marginBottom:4,letterSpacing:0.6}}>BUDGET %</div>
            <input type="number" value={pctStr} onChange={e=>setPctStr(e.target.value)} step="0.1" min="0"
              style={{width:"100%",padding:"9px 11px",borderRadius:8,border:"1px solid #E0E6ED",fontSize:13}} />
          </div>
        </div>

        <div style={{marginBottom:12}}>
          <div style={{fontSize:11,fontWeight:700,color:"#8A9BB0",marginBottom:6,letterSpacing:0.6}}>KLEUR</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {PRESET_COLORS.map(c => (
              <button key={c} onClick={()=>setColor(c)}
                style={{width:28,height:28,borderRadius:"50%",border:color===c?"3px solid #1F4E79":"1px solid #E0E6ED",background:c,cursor:"pointer"}} />
            ))}
          </div>
        </div>

        <label style={{display:"flex",alignItems:"center",gap:8,fontSize:12,color:"#2C3E50",marginBottom:14,cursor:"pointer"}}>
          <input type="checkbox" checked={skipRed} onChange={e=>setSkipRed(e.target.checked)} />
          <span>Geen rode waarschuwing bij overschrijding (voor sparen/investeren)</span>
        </label>

        {err && <div style={{fontSize:12,color:"#E74C3C",marginBottom:10,fontWeight:600}}>{err}</div>}

        <div style={{display:"flex",gap:10}}>
          <button onClick={onCancel} style={{flex:1,padding:11,borderRadius:10,border:"1px solid #E0E6ED",background:"white",color:"#5A6A7A",fontSize:13,fontWeight:600}}>Annuleren</button>
          <button onClick={submit} style={{flex:1,padding:11,borderRadius:10,border:"none",background:"#1F4E79",color:"white",fontSize:13,fontWeight:700}}>Toevoegen</button>
        </div>
      </div>
    </div>
  );
}

// ─── IMPORT MODAL ────────────────────────────────────────────────────────────
function ImportModal({ state, setState, onConfirm, cats, existing }) {
  const { bank: initialBank, rawText, fileName } = state;
  const [bank, setBank] = useState(initialBank);
  const [reviewed, setReviewed] = useState(state.pending || []);
  const [duplicateIds, setDuplicateIds] = useState(new Set()); // ids die NIET meegenomen worden
  const [bulkCat, setBulkCat] = useState(null); // {catName, txIds:Set}
  const [expandedGroups, setExpandedGroups] = useState(new Set(["Onbekend"]));
  const [showDupPrompt, setShowDupPrompt] = useState(false);

  const allCatNames = [...cats.map(c=>c.name),"Inkomen","Interne transfer","Onbekend"];

  // Re-parse wanneer bank handmatig gewijzigd wordt
  function reparseWithBank(newBank){
    setBank(newBank);
    if (!rawText) return;
    const { rows } = parseCSV(rawText, newBank);
    setReviewed(rows);
    setDuplicateIds(new Set());
  }

  // Detecteer duplicaten t.o.v. bestaande transacties
  const existingKeys = useMemo(() => {
    return new Set((existing||[]).map(t => `${t.datum}|${t.naam}|${t.bedrag.toFixed(2)}`));
  }, [existing]);
  const dupTxs = useMemo(() => {
    return reviewed.filter(t => existingKeys.has(`${t.datum}|${t.naam}|${t.bedrag.toFixed(2)}`));
  }, [reviewed, existingKeys]);

  // Bij eerste load: als >10 dup, toon prompt
  useEffect(() => {
    if (dupTxs.length > 10 && !showDupPrompt && duplicateIds.size === 0){
      setShowDupPrompt(true);
    }
  // eslint-disable-next-line
  }, [dupTxs.length]);

  function skipAllDups(){
    setDuplicateIds(new Set(dupTxs.map(t => t.id)));
    setShowDupPrompt(false);
  }
  function keepAllDups(){
    setDuplicateIds(new Set());
    setShowDupPrompt(false);
  }
  function toggleDup(txId){
    setDuplicateIds(prev => {
      const next = new Set(prev);
      if (next.has(txId)) next.delete(txId); else next.add(txId);
      return next;
    });
  }

  function changeCat(id, cat) {
    setReviewed(prev => prev.map(t => t.id===id ? {...t,categorie:cat} : t));
  }

  // Bevestig import: leer categorieën, filter duplicaten
  function confirm() {
    const toAdd = reviewed.filter(t => !duplicateIds.has(t.id));
    toAdd.forEach(t => {
      if (t.categorie && t.categorie !== "Onbekend") learnCat(t.naam, t.categorie);
    });
    onConfirm(toAdd);
  }

  // Groepeer per categorie: Onbekend bovenaan, daarna rest
  const groups = useMemo(() => {
    const map = {};
    reviewed.forEach(t => {
      const k = t.categorie || "Onbekend";
      if (!map[k]) map[k] = [];
      map[k].push(t);
    });
    const names = Object.keys(map);
    names.sort((a,b) => {
      if (a === "Onbekend") return -1;
      if (b === "Onbekend") return 1;
      return map[b].length - map[a].length;
    });
    return names.map(n => ({ name:n, txs:map[n] }));
  }, [reviewed]);

  function toggleGroup(name){
    setExpandedGroups(prev => {
      const next = new Set(prev);
      if (next.has(name)) next.delete(name); else next.add(name);
      return next;
    });
  }

  // Bulk UI: open voor groep, vooraf alle txs in groep geselecteerd
  function openBulk(groupName){
    const ids = new Set(groups.find(g => g.name===groupName).txs.map(t => t.id));
    setBulkCat({ fromCat: groupName, toCat: groupName, txIds: ids });
  }
  function toggleBulkTx(id){
    setBulkCat(prev => {
      if (!prev) return prev;
      const next = new Set(prev.txIds);
      if (next.has(id)) next.delete(id); else next.add(id);
      return { ...prev, txIds: next };
    });
  }
  function applyBulk(){
    if (!bulkCat || bulkCat.toCat === bulkCat.fromCat) { setBulkCat(null); return; }
    setReviewed(prev => prev.map(t => bulkCat.txIds.has(t.id) ? {...t, categorie: bulkCat.toCat} : t));
    setBulkCat(null);
  }

  const toImport = reviewed.filter(t => !duplicateIds.has(t.id));
  const hasResults = reviewed.length > 0;
  const isUnknownFormat = !bank;

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:200,display:"flex",flexDirection:"column",justifyContent:"flex-end"}}>
      <div style={{background:"white",borderRadius:"20px 20px 0 0",maxHeight:"90vh",display:"flex",flexDirection:"column"}}>
        {/* Header */}
        <div style={{padding:"14px 18px 10px",borderBottom:"1px solid #F0F4F8"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
            <div>
              <div style={{fontSize:16,fontWeight:800,color:"#1F4E79"}}>Import controleren</div>
              <div style={{fontSize:11,color:"#9AA5B4",marginTop:2}}>
                {fileName && <span>{fileName} · </span>}
                {bank
                  ? <span>{BANK_PARSERS[bank]?.label || bank} herkend · {reviewed.length} transacties</span>
                  : <span style={{color:"#C0392B",fontWeight:600}}>Formaat niet herkend</span>}
                {dupTxs.length > 0 && <span> · <b>{dupTxs.length} duplicaten</b></span>}
              </div>
            </div>
            <select value={bank || ""} onChange={e=>reparseWithBank(e.target.value || null)}
              style={{fontSize:11,border:"1px solid #E0E6ED",borderRadius:6,padding:"4px 6px",background:"white",color:"#2C3E50"}}>
              <option value="">Kies bank…</option>
              {Object.entries(BANK_PARSERS).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
            </select>
          </div>
          {isUnknownFormat && (
            <div style={{marginTop:8,padding:"8px 10px",background:"#FEE",borderRadius:8,fontSize:11,color:"#C0392B"}}>
              Kies rechtsboven handmatig de bank om het bestand te lezen.
            </div>
          )}
          {dupTxs.length > 0 && dupTxs.length <= 10 && (
            <div style={{marginTop:8,padding:"8px 10px",background:"#FEF3CD",borderRadius:8,fontSize:11,color:"#856404"}}>
              ⚠️ {dupTxs.length} mogelijke duplicaten. Vink aan om individueel over te slaan.
            </div>
          )}
        </div>

        {/* Lijst */}
        <div style={{flex:1,overflowY:"auto",padding:"8px 14px"}}>
          {!hasResults && !isUnknownFormat && <div style={{textAlign:"center",color:"#9AA5B4",padding:40,fontSize:13}}>Geen transacties in dit bestand.</div>}
          {groups.map(g => {
            const catDef = cats.find(c => c.name === g.name);
            const isExpanded = expandedGroups.has(g.name);
            const dupInGroup = g.txs.filter(t => existingKeys.has(`${t.datum}|${t.naam}|${t.bedrag.toFixed(2)}`));
            return (
              <div key={g.name} style={{marginBottom:10,border:"1px solid #F0F4F8",borderRadius:10,overflow:"hidden",background:"#F8FAFB"}}>
                {/* Groepsheader */}
                <div onClick={()=>toggleGroup(g.name)}
                  style={{display:"flex",alignItems:"center",gap:8,padding:"9px 12px",cursor:"pointer",background:g.name==="Onbekend"?"#FFF4D6":"white"}}>
                  <div style={{width:28,height:28,borderRadius:8,background:catDef?.color ?? "#E8ECF0",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>
                    {catDef?.icon ?? (g.name==="Onbekend"?"❓":"💶")}
                  </div>
                  <div style={{flex:1,fontSize:13,fontWeight:700,color:g.name==="Onbekend"?"#856404":"#2C3E50"}}>
                    {g.name} <span style={{color:"#9AA5B4",fontWeight:500}}>· {g.txs.length}</span>
                    {dupInGroup.length > 0 && <span style={{color:"#C0392B",fontWeight:600,fontSize:11,marginLeft:6}}>· {dupInGroup.length} dup</span>}
                  </div>
                  <button onClick={(e)=>{e.stopPropagation();openBulk(g.name);}}
                    style={{padding:"3px 9px",borderRadius:12,border:"1px solid #E0E6ED",background:"white",color:"#1F4E79",fontSize:11,fontWeight:600,cursor:"pointer"}}>
                    Bulk ↻
                  </button>
                  <span style={{fontSize:10,color:"#9AA5B4",marginLeft:6}}>{isExpanded?"▲":"▼"}</span>
                </div>
                {/* Transacties */}
                {isExpanded && g.txs.map(t => {
                  const isDup = existingKeys.has(`${t.datum}|${t.naam}|${t.bedrag.toFixed(2)}`);
                  const skipped = duplicateIds.has(t.id);
                  return (
                    <div key={t.id} style={{padding:"8px 12px",borderTop:"1px solid #F0F4F8",display:"flex",alignItems:"center",gap:8,background:skipped?"#F5F5F5":"white",opacity:skipped?0.55:1}}>
                      {isDup && (
                        <input type="checkbox" checked={!skipped} onChange={()=>toggleDup(t.id)}
                          title={skipped?"Overslaan":"Meenemen"}
                          style={{width:16,height:16,accentColor:"#1F4E79",cursor:"pointer"}} />
                      )}
                      <div style={{flex:1,overflow:"hidden"}}>
                        <div style={{fontSize:12,fontWeight:600,color:"#2C3E50",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                          {t.naam}
                          {isDup && <span style={{marginLeft:6,fontSize:9,fontWeight:700,color:"#C0392B",background:"#FEE",padding:"1px 5px",borderRadius:4}}>DUP</span>}
                        </div>
                        <div style={{fontSize:10,color:"#9AA5B4"}}>{fmtTxDate(t.datum)} · {t.afBij==="Bij"?"+":"−"}€{fmt(Math.abs(t.bedrag))}</div>
                      </div>
                      <select value={t.categorie} onChange={e=>changeCat(t.id,e.target.value)}
                        style={{fontSize:11,border:"1px solid #E0E6ED",borderRadius:6,padding:"3px 5px",color:"#2C3E50",background:"white",maxWidth:130}}>
                        {allCatNames.map(c=><option key={c} value={c}>{c}</option>)}
                      </select>
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>

        {/* Footer */}
        <div style={{padding:"12px 14px",borderTop:"1px solid #F0F4F8",display:"flex",gap:10}}>
          <button onClick={()=>setState(null)} style={{flex:1,padding:12,borderRadius:10,border:"1px solid #E0E6ED",background:"white",color:"#5A6A7A",fontSize:13,fontWeight:600}}>Annuleren</button>
          <button onClick={confirm} disabled={toImport.length===0}
            style={{flex:2,padding:12,borderRadius:10,border:"none",background:toImport.length===0?"#B0BEC5":"#1F4E79",color:"white",fontSize:13,fontWeight:700,cursor:toImport.length===0?"not-allowed":"pointer"}}>
            Toevoegen ({toImport.length})
          </button>
        </div>
      </div>

      {/* Popup: >10 duplicaten */}
      {showDupPrompt && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div style={{background:"white",borderRadius:16,maxWidth:360,width:"100%",padding:"18px 20px",boxShadow:"0 10px 30px rgba(0,0,0,0.3)"}}>
            <div style={{fontSize:16,fontWeight:800,color:"#1F4E79",marginBottom:10}}>{dupTxs.length} duplicaten gevonden</div>
            <div style={{fontSize:13,color:"#2C3E50",lineHeight:1.5,marginBottom:14}}>
              Je importeert veel transacties die al in de app staan (datum + naam + bedrag).
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              <button onClick={skipAllDups}
                style={{padding:12,borderRadius:10,border:"none",background:"#1F4E79",color:"white",fontSize:13,fontWeight:700,cursor:"pointer"}}>
                Duplicaten overslaan
              </button>
              <button onClick={keepAllDups}
                style={{padding:12,borderRadius:10,border:"1px solid #E0E6ED",background:"white",color:"#2C3E50",fontSize:13,fontWeight:600,cursor:"pointer"}}>
                Toch allemaal importeren
              </button>
              <button onClick={()=>{setShowDupPrompt(false);setState(null);}}
                style={{padding:10,borderRadius:10,border:"none",background:"transparent",color:"#C0392B",fontSize:12,fontWeight:600,cursor:"pointer"}}>
                Import afbreken
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Bulk modal */}
      {bulkCat && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:310,display:"flex",alignItems:"flex-end",justifyContent:"center"}}
             onClick={e=>{if(e.target===e.currentTarget)setBulkCat(null);}}>
          <div style={{background:"white",borderRadius:"20px 20px 0 0",maxWidth:480,width:"100%",maxHeight:"80vh",display:"flex",flexDirection:"column"}}>
            <div style={{padding:"14px 18px 10px",borderBottom:"1px solid #F0F4F8"}}>
              <div style={{fontSize:15,fontWeight:800,color:"#1F4E79"}}>Bulk categorie wijzigen</div>
              <div style={{fontSize:11,color:"#9AA5B4",marginTop:2}}>Van: <b>{bulkCat.fromCat}</b></div>
            </div>
            <div style={{padding:"10px 14px",borderBottom:"1px solid #F0F4F8",display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:11,color:"#9AA5B4"}}>Naar:</span>
              <select value={bulkCat.toCat} onChange={e=>setBulkCat(prev=>({...prev,toCat:e.target.value}))}
                style={{flex:1,fontSize:12,border:"1px solid #E0E6ED",borderRadius:6,padding:"5px 7px",background:"white",color:"#2C3E50"}}>
                {allCatNames.map(c=><option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div style={{flex:1,overflowY:"auto",padding:"8px 14px"}}>
              <div style={{fontSize:11,color:"#9AA5B4",marginBottom:6,fontWeight:600}}>Aangevinkt worden mee gewijzigd ({bulkCat.txIds.size}):</div>
              {(() => {
                const group = reviewed.filter(t => t.categorie === bulkCat.fromCat);
                return group.map(t => (
                  <label key={t.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 4px",borderBottom:"1px solid #F8FAFB",cursor:"pointer"}}>
                    <input type="checkbox" checked={bulkCat.txIds.has(t.id)} onChange={()=>toggleBulkTx(t.id)}
                      style={{width:15,height:15,accentColor:"#1F4E79",cursor:"pointer"}} />
                    <div style={{flex:1,overflow:"hidden"}}>
                      <div style={{fontSize:12,fontWeight:600,color:"#2C3E50",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{t.naam}</div>
                      <div style={{fontSize:10,color:"#9AA5B4"}}>{fmtTxDate(t.datum)} · €{fmt(Math.abs(t.bedrag))}</div>
                    </div>
                  </label>
                ));
              })()}
            </div>
            <div style={{padding:"12px 14px",borderTop:"1px solid #F0F4F8",display:"flex",gap:10}}>
              <button onClick={()=>setBulkCat(null)}
                style={{flex:1,padding:11,borderRadius:10,border:"1px solid #E0E6ED",background:"white",color:"#5A6A7A",fontSize:13,fontWeight:600}}>
                Annuleren
              </button>
              <button onClick={applyBulk} disabled={bulkCat.toCat===bulkCat.fromCat || bulkCat.txIds.size===0}
                style={{flex:2,padding:11,borderRadius:10,border:"none",
                  background:(bulkCat.toCat===bulkCat.fromCat || bulkCat.txIds.size===0)?"#B0BEC5":"#1F4E79",
                  color:"white",fontSize:13,fontWeight:700}}>
                Verplaats {bulkCat.txIds.size}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── BOOT ────────────────────────────────────────────────────────────────────
ReactDOM.createRoot(document.getElementById("root")).render(
  <AuthGate>{(session) => <App session={session} />}</AuthGate>
);
</script>
</body>
</html>
